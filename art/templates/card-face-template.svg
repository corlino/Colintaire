  <!-- Notes -->
  <text x="375" y="219" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b7f82" text-anchor="middle">Teal band (top 17%): rank + suit must sit here.</text>
  <text x="375" y="243" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#5b5b5b" text-anchor="middle">It is all that shows when a stack is squeezed.</text>
  <text x="375" y="821" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="500" fill="#5b5b5b" text-anchor="middle">Bottom-row piles stack upward, so this edge shows there.</text>
  <text x="375" y="845" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b7f82" text-anchor="middle">Keep this index upright too (not rotated 180°).</text>
  <text x="375" y="485" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#5b5b5b" text-anchor="middle">Centre artwork</text>
  <text x="375" y="525" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5b5b5b" text-anchor="middle">Only seen on the top card of a pile.</text>
  <text x="375" y="553" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5b5b5b" text-anchor="middle">Amber bands (24%): visible in a normal fanned stack.</text>
  <text x="375" y="581" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#5b5b5b" text-anchor="middle">Corners are rounded by the app: leave them square.</text>
  <text x="375" y="625" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#5b5b5b" text-anchor="middle">750 × 1050 px · save as S01.png … D13.png</text></svg>